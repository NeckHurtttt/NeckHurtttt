name: snake neón
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
  push: {branches: [main], paths: [.github/workflows/snake.yml]}
permissions: {contents: write}
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff2a6d&color_dots=#160c2c,#3a1d6e,#9d4edd,#05d9e8,#fcee0a&color_dot_border=#06040e&color_background=#06040e
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
